[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrosis"
version = "0.1.0"
description = "CLI orbital mechanics calculator — J2/J3/J4 propagation, conjunction screening, pass prediction"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Utkarsh Joshi", email = "utkarshjoshi@users.noreply.github.com"}]
keywords = ["orbital mechanics", "satellite", "astronomy", "astrodynamics", "space"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "httpx>=0.27.0",
    "sgp4>=2.23",
    "rich>=13.0.0",
    "textual>=0.60.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8.0"]
dev = ["pytest", "black", "flake8", "mypy"]

[project.scripts]
astrosis = "astrosis.cli:main"

[project.urls]
Homepage = "https://github.com/UtkarshJoshiNtl/Astrosis"
Repository = "https://github.com/UtkarshJoshiNtl/Astrosis"
Issues = "https://github.com/UtkarshJoshiNtl/Astrosis/issues"

[tool.setuptools.packages.find]
include = ["astrosis", "astrosis.*"]

[tool.setuptools.package-data]
astrosis = ["py.typed"]
"astrosis.data" = ["*.txt"]
