[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astrosis"
version = "0.1.0"
description = "CLI orbital mechanics calculator — J2/J3/J4 propagation, conjunction screening, pass prediction"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["orbital mechanics", "satellite", "astronomy", "astrodynamics", "space"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    "httpx>=0.27.0",
    "sgp4>=2.23",
    "rich>=13.0.0",
    "textual>=0.60.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8.0"]
dev = ["pytest", "black", "flake8", "mypy"]

[project.scripts]
astrosis = "engine.cli:main"

[project.urls]
Homepage = "https://github.com/UtkarshJoshiNtl/astrosis"
Repository = "https://github.com/UtkarshJoshiNtl/astrosis"
Issues = "https://github.com/UtkarshJoshiNtl/astrosis/issues"

[tool.setuptools.packages.find]
include = ["engine*"]

[tool.setuptools.package-data]
engine = ["py.typed"]
